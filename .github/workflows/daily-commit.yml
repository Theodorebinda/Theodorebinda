name: Trois commits quotidiens

on:
  schedule:
    # Ces crons UTC correspondent à 08 h 15, 14 h 15 et 20 h 15 à Kinshasa.
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Africa/Kinshasa

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurer Git
        run: |
          git config --local user.email "133812059+Theodorebinda@users.noreply.github.com"
          git config --local user.name "Theodore SAMBA"

      - name: Récupérer les dernières modifications
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git pull --rebase origin "$DEFAULT_BRANCH"

      - name: Mettre à jour le README
        env:
          DAILY_COMMIT_SLOT: ${{ github.event.schedule }}
        run: node scripts/update-readme.js

      - name: Créer et pousser le commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Le commit du jour existe déjà."
            exit 0
          fi

          commit_date=$(date '+%Y-%m-%d à %H:%M')
          git add README.md
          git commit -m "chore: mise à jour du ${commit_date}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
